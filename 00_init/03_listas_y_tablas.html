<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas y tablas</title>
  </head>
  <body>
    <h1>Listas</h1>

    <ul>
      <li>Manzana</li>
      <li>Banana</li>
      <li>Uva</li>
    </ul>

    <ol>
      <li>Preparar</li>
      <li>Mezclar</li>
      <li>Servir</li>
    </ol>

    <dl>
      <dt>HTML</dt>
      <dd>Lenguaje de marcado para crear páginas web.</dd>
      <dt>CSS</dt>
      <dd>Lenguaje para dar estilo a la página.</dd>
    </dl>

    <h2>Tablas</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Ciudad</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ana</td>
          <td>25</td>
          <td>Guadalajara</td>
        </tr>
        <tr>
          <td>Mateo</td>
          <td>31</td>
          <td>CDMX</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
