<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios</title>
  </head>
  <body>
    <h1>Formulario de contacto</h1>

    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" />
      <br /><br />

      <label for="email">Correo:</label>
      <input type="email" id="email" name="email" placeholder="tu@email.com" />
      <br /><br />

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" />
      <br /><br />

      <label for="pais">País:</label>
      <select id="pais" name="pais">
        <option value="mx">México</option>
        <option value="ar">Argentina</option>
        <option value="es">España</option>
      </select>
      <br /><br />

      <label>Género:</label><br />
      <input type="radio" name="genero" value="mujer" /> Mujer
      <input type="radio" name="genero" value="hombre" /> Hombre
      <input type="radio" name="genero" value="otro" /> Otro
      <br /><br />

      <label>Intereses:</label><br />
      <input type="checkbox" name="intereses" value="html" /> HTML
      <input type="checkbox" name="intereses" value="css" /> CSS
      <input type="checkbox" name="intereses" value="js" /> JavaScript
      <br /><br />

      <label for="mensaje">Mensaje:</label><br />
      <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>
      <br /><br />

      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
