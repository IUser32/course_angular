<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texto, enlaces e imágenes</title>
  </head>
  <body>
    <h1>Texto y multimedia</h1>

    <p>
      Este texto tiene <strong>negrita</strong>, <em>cursiva</em>,
      <mark>resaltado</mark> y <small>texto pequeño</small>.
    </p>

    <p>
      Visita <a href="https://www.google.com" target="_blank">Google</a>
      para buscar información.
    </p>

    <img
      src="https://via.placeholder.com/300x180"
      alt="Imagen de ejemplo"
      width="300"
    />
  </body>
</html>
